name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check source syntax
        run: |
          npm run check
          npm run check:docs
      - name: Install REUSE SPDX checker
        run: python -m pip install -r requirements-reuse.txt
      - name: Verify REUSE/SPDX license metadata
        run: npm run check:reuse
      - name: Install Console dependencies
        run: npm ci --prefix console
      - name: Audit shipped Console dependencies
        run: npm audit --prefix console --omit=dev --audit-level=high
      - name: Report Console build and test tooling advisories
        # Build and test tools never reach the served bundle. Advisories here stay
        # visible in the log without blocking until an upstream fix exists.
        continue-on-error: true
        run: npm audit --prefix console --audit-level=high
      - name: Verify generated Console endpoint inventory
        run: npm run console:check:endpoints
      - name: Verify generated Console API reference
        run: npm --prefix console run check:api-reference
      - name: Test and build Console
        run: |
          npm run console:test
          npm run console:build
      - name: Build and contract-test packaged Console
        run: npm run test:console-container
      - name: Install development-only contract validators
        run: python -m pip install -r requirements-contracts.txt
      - name: Validate implemented OpenAPI and validator regression controls
        run: |
          npm run check:contracts
          npm run test:contract-validator
      - name: Test HTTP contract and startup validation
        run: npm test
      - name: Verify deterministic source candidate packaging
        run: |
          npm run release:package
          cp dist/releases/*.tar /tmp/junctura-first.tar
          npm run release:package
          cmp /tmp/junctura-first.tar dist/releases/*.tar
          npm run release:verify
      - name: Verify guarded provider transport with host OpenSSL
        run: npm run test:provider-network
      - name: Verify fresh private execution authority and audit rollback
        run: npm run test:execution-ledger
      - name: Verify migration checksums, drift detection and concurrent runners
        run: npm run test:migrations
      - name: Validate Compose configuration
        id: compose-config
        run: |
          npm run setup
          docker compose config --quiet
      - name: Build and start the local container
        run: docker compose -f compose.yaml -f infra/openbao/compose.bootstrap.yaml up --build --detach --wait --wait-timeout 900
      - name: Provision directory and application identity synchronization
        run: npm run directory:provision
      - name: Verify managed configuration and Core process recovery
        run: |
          npm run reconcile -- --check
          npm run test:reconcile
          npm run test:self-heal
      - name: Probe host and container endpoints
        run: |
          npm run healthcheck
          docker compose exec -T core node scripts/check-health.mjs
      - name: Run HTTP tests in the pinned container runtime
        run: docker compose -f compose.yaml -f infra/testing/compose.unit.yaml run --rm --no-deps --volume "$PWD/tests:/app/tests:ro" --volume "$PWD/scripts:/app/scripts:ro" --volume "$PWD/.env.example:/app/.env.example:ro" --volume "$PWD/sdk:/app/sdk:ro" --volume "$PWD/docs/contracts:/app/docs/contracts:ro" --volume "$PWD/infra/postgres:/app/infra/postgres:ro" --volume "$PWD/infra/keycloak:/app/infra/keycloak:ro" --volume "$PWD/infra/flowable:/app/infra/flowable:ro" --volume "$PWD/examples:/app/examples:ro" --volume "$PWD/compose.yaml:/app/compose.yaml:ro" core node --test
      - name: Verify real Core integrations
        run: npm run test:integration
      - name: Verify administrator TOTP on both Console sign-in flows
        run: npm run test:admin-mfa
      - name: Verify record operations through the gateway
        run: |
          npm run test:records
          npm run test:record-queries
          npm run test:record-archives
          npm run test:app-backup
          npm run test:app-group-shares
      - name: Verify directory management against the real identity provider
        run: npm run test:directory
      - name: Verify per-reader record field masking
        run: |
          npm run test:field-masking
          npm run test:auto-audit
      - name: Verify application access, unit isolation and denial reasons
        run: npm run test:app-access
      - name: Verify application startup and key rotation through OpenBao
        run: npm run test:app-bootstrap
      - name: Verify token exchange and delegated access
        run: npm run test:delegation
      - name: Verify resource consent and subject access history
        run: npm run test:consent
      - name: Verify resource consent requests
        run: npm run test:consent-requests
      - name: Verify capability catalog and access requests
        run: npm run test:access-requests
      - name: Verify catalog visibility levels and tenant isolation
        run: npm run test:catalog-visibility
      - name: Verify workflow task policy and outbox against Flowable
        run: npm run test:workflow-tasks
      - name: Verify workflow task completion output against Flowable
        run: npm run test:workflow-task-output
      - name: Verify registration, guarded capability invocation, resource isolation and Flowable worker
        run: |
          npm run test:applications
          npm run test:capabilities
          npm run test:compositions
          npm run test:flowable-worker
      - name: Verify isolated backup and restore with tenant RLS
        run: npm run test:recovery
      - name: Verify protected audit boundary, redaction and persistence
        run: npm run test:audit
      - name: Verify application audit, multipart objects, search and subject access
        run: |
          npm run test:audit-app
          npm run test:object-metadata
          npm run test:search
          npm run test:subject-access
      - name: Verify authorized live events with scaled Core
        run: |
          docker compose up --detach --no-deps --scale core=2 --wait --wait-timeout 60 core
          npm run test:events
      - name: Verify application message queues with scaled Core
        run: npm run test:message-queue
      - name: Verify record operations through the gateway in strict mode
        env:
          STRICT_RECORD_WRITES: "true"
        run: |
          docker compose up --detach --no-deps --scale core=1 --force-recreate --wait --wait-timeout 60 core
          npm run healthcheck
          npm run test:records
          npm run test:record-queries
          npm run test:record-archives
          npm run test:app-group-shares
          npm run test:field-masking
      - name: Verify Prometheus scraping and Grafana provisioning
        run: |
          docker compose --profile monitoring up --detach --no-deps --wait --wait-timeout 300 prometheus grafana
          npm run test:monitoring
      - name: Collect container diagnostics on failure
        if: failure() && steps.compose-config.outcome == 'success'
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always() && steps.compose-config.outcome == 'success'
        run: docker compose -f compose.yaml -f infra/openbao/compose.bootstrap.yaml down

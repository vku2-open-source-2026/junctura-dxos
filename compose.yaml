name: junctura
services:
  database:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    restart: unless-stopped
    environment:
      POSTGRES_USER: junctura_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run npm run setup first}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:?Run npm run setup first}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Run npm run setup first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U junctura_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [identity, data, workflow]
  identity:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -ec
      - |
        export APP_SYNC_CLIENT_ENABLED=false
        if [[ "$$APP_SYNC_CLIENT_ID" == junctura-app-sync && "$$APP_SYNC_CLIENT_SECRET" =~ [^[:space:]] ]]; then
          export APP_SYNC_CLIENT_ENABLED=true
        else
          unset APP_SYNC_CLIENT_SECRET
        fi
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/junctura_identity
      KC_DB_USERNAME: junctura_identity
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run npm run setup first}
      KC_BOOTSTRAP_ADMIN_USERNAME: junctura-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run npm run setup first}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: ${PUBLIC_URL:-http://127.0.0.1:8080}/identity
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
      CORE_CLIENT_SECRET: ${CORE_CLIENT_SECRET:?Run npm run setup first}
      TENANT_A_SECRET: ${TENANT_A_SECRET:?Run npm run setup first}
      TENANT_B_SECRET: ${TENANT_B_SECRET:?Run npm run setup first}
      READER_SECRET: ${READER_SECRET:?Run npm run setup first}
      SSO_USER_PASSWORD: ${SSO_USER_PASSWORD:?Run npm run setup first}
      APP_SYNC_CLIENT_ID: ${APP_SYNC_CLIENT_ID:-junctura-app-sync}
      APP_SYNC_CLIENT_SECRET: ${APP_SYNC_CLIENT_SECRET:-}
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./infra/keycloak/themes/junctura:/opt/keycloak/themes/junctura:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /identity/health/ready HTTP/1.0\r\n\r\n" >&3; head -n1 <&3 | grep -q "200"''']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [identity]
  data-migrate:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    entrypoint: [sh, /migrations/migrate.sh]
    command: [-h, database, -U, junctura_admin, -d, junctura_data, -v, ON_ERROR_STOP=1]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    volumes:
      - ./infra/postgres/migrate.sh:/migrations/migrate.sh:ro
      - ./infra/postgres/001-data.sql:/migrations/001-data.sql:ro
      - ./infra/postgres/002-workflow-requests.sql:/migrations/002-workflow-requests.sql:ro
      - ./infra/postgres/003-applications.sql:/migrations/003-applications.sql:ro
      - ./infra/postgres/004-resource-authorization.sql:/migrations/004-resource-authorization.sql:ro
      - ./infra/postgres/005-audit-protection.sql:/migrations/005-audit-protection.sql:ro
      - ./infra/postgres/006-capability-registry.sql:/migrations/006-capability-registry.sql:ro
      - ./infra/postgres/007-direct-trust.sql:/migrations/007-direct-trust.sql:ro
      - ./infra/postgres/008-trust-lifecycle.sql:/migrations/008-trust-lifecycle.sql:ro
      - ./infra/postgres/009-authorized-discovery.sql:/migrations/009-authorized-discovery.sql:ro
      - ./infra/postgres/010-capability-execution.sql:/migrations/010-capability-execution.sql:ro
      - ./infra/postgres/011-execution-finalization.sql:/migrations/011-execution-finalization.sql:ro
      - ./infra/postgres/012-composition.sql:/migrations/012-composition.sql:ro
      - ./infra/postgres/013-composition-authority.sql:/migrations/013-composition-authority.sql:ro
      - ./infra/postgres/014-composition-registry-guards.sql:/migrations/014-composition-registry-guards.sql:ro
      - ./infra/postgres/015-composition-reservation.sql:/migrations/015-composition-reservation.sql:ro
      - ./infra/postgres/016-composition-finalization.sql:/migrations/016-composition-finalization.sql:ro
      - ./infra/postgres/017-composition-exact-grants.sql:/migrations/017-composition-exact-grants.sql:ro
      - ./infra/postgres/018-audit-chain.sql:/migrations/018-audit-chain.sql:ro
      - ./infra/postgres/019-trust-graph.sql:/migrations/019-trust-graph.sql:ro
      - ./infra/postgres/020-subject-access.sql:/migrations/020-subject-access.sql:ro
      - ./infra/postgres/021-consent-emergency.sql:/migrations/021-consent-emergency.sql:ro
      - ./infra/postgres/022-directory.sql:/migrations/022-directory.sql:ro
      - ./infra/postgres/023-principal-profile.sql:/migrations/023-principal-profile.sql:ro
      - ./infra/postgres/024-directory-active-only.sql:/migrations/024-directory-active-only.sql:ro
      - ./infra/postgres/025-storage-summary.sql:/migrations/025-storage-summary.sql:ro
      - ./infra/postgres/026-storage-collections.sql:/migrations/026-storage-collections.sql:ro
      - ./infra/postgres/027-application-stats.sql:/migrations/027-application-stats.sql:ro
      - ./infra/postgres/028-trust-graph-read.sql:/migrations/028-trust-graph-read.sql:ro
      - ./infra/postgres/029-read-only-viewers.sql:/migrations/029-read-only-viewers.sql:ro
      - ./infra/postgres/030-versioned-records.sql:/migrations/030-versioned-records.sql:ro
      - ./infra/postgres/031-record-queries.sql:/migrations/031-record-queries.sql:ro
      - ./infra/postgres/032-record-locks-and-increments.sql:/migrations/032-record-locks-and-increments.sql:ro
      - ./infra/postgres/033-record-batch.sql:/migrations/033-record-batch.sql:ro
      - ./infra/postgres/034-record-archives.sql:/migrations/034-record-archives.sql:ro
      - ./infra/postgres/035-app-group-shares.sql:/migrations/035-app-group-shares.sql:ro
      - ./infra/postgres/036-subject-bindings.sql:/migrations/036-subject-bindings.sql:ro
      - ./infra/postgres/037-directory-management.sql:/migrations/037-directory-management.sql:ro
      - ./infra/postgres/038-verified-subject-consents.sql:/migrations/038-verified-subject-consents.sql:ro
      - ./infra/postgres/039-workflow-deadlines.sql:/migrations/039-workflow-deadlines.sql:ro
      - ./infra/postgres/040-workflow-completion-outbox.sql:/migrations/040-workflow-completion-outbox.sql:ro
      - ./infra/postgres/041-workflow-task-recovery.sql:/migrations/041-workflow-task-recovery.sql:ro
      - ./infra/postgres/042-application-audit.sql:/migrations/042-application-audit.sql:ro
      - ./infra/postgres/043-object-metadata-and-quota.sql:/migrations/043-object-metadata-and-quota.sql:ro
      - ./infra/postgres/044-search-index-jobs.sql:/migrations/044-search-index-jobs.sql:ro
      - ./infra/postgres/045-authorized-events.sql:/migrations/045-authorized-events.sql:ro
      - ./infra/postgres/046-subject-access-reports.sql:/migrations/046-subject-access-reports.sql:ro
      - ./infra/postgres/047-app-access.sql:/migrations/047-app-access.sql:ro
      - ./infra/postgres/048-app-data-units.sql:/migrations/048-app-data-units.sql:ro
      - ./infra/postgres/049-access-denial-reasons.sql:/migrations/049-access-denial-reasons.sql:ro
      - ./infra/postgres/050-app-access-compatibility.sql:/migrations/050-app-access-compatibility.sql:ro
      - ./infra/postgres/051-delegation.sql:/migrations/051-delegation.sql:ro
      - ./infra/postgres/052-resource-consents.sql:/migrations/052-resource-consents.sql:ro
      - ./infra/postgres/053-resource-consent-requests.sql:/migrations/053-resource-consent-requests.sql:ro
      - ./infra/postgres/060-catalog-visibility.sql:/migrations/060-catalog-visibility.sql:ro
      - ./infra/postgres/061-capability-access-requests.sql:/migrations/061-capability-access-requests.sql:ro
      - ./infra/postgres/062-record-field-masking.sql:/migrations/062-record-field-masking.sql:ro
      - ./infra/postgres/063-record-mask-response.sql:/migrations/063-record-mask-response.sql:ro
      - ./infra/postgres/064-app-bootstrap-lease.sql:/migrations/064-app-bootstrap-lease.sql:ro
      - ./infra/postgres/065-message-queues.sql:/migrations/065-message-queues.sql:ro
      - ./infra/postgres/071-exceptional-access-review.sql:/migrations/071-exceptional-access-review.sql:ro
    depends_on:
      database:
        condition: service_healthy
    networks: [data]
  data:
    image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://junctura_data:${DATA_DB_PASSWORD:?Run npm run setup first}@database:5432/junctura_data
      PGRST_DB_SCHEMAS: core
      PGRST_JWT_SECRET: ${DATA_JWT_SECRET:?Run npm run setup first}
      PGRST_JWT_AUD: junctura-data
      PGRST_DB_MAX_ROWS: "100"
    depends_on:
      data-migrate:
        condition: service_completed_successfully
    networks: [data]
  objects:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command: [server, -dir=/data, -ip=objects, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=64, -volume.max=4, -filer]
    volumes:
      - object-data:/data
      - ./infra/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro
    networks: [objects]
  clamav:
    image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    restart: unless-stopped
    environment:
      CLAMD_STARTUP_TIMEOUT: "1800"
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks: [scanner]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 2G
    # Internal only: no published ports. Signature updates use FreshClam inside the image.
  search:
    image: getmeili/meilisearch:v1.19@sha256:abab6e9054572fea9fd409cf0f4fe3b65f6c8e70cd0f213004592b6d0e9587ac
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Run npm run setup first, or on an upgrade append a generated MEILI_MASTER_KEY to the existing .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data
    networks: [searchnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # Internal only: no published ports. Only Core reaches the index network.
  secrets:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    restart: unless-stopped
    command: [server]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ./infra/openbao/local.hcl:/openbao/config/local.hcl:ro
    networks: [secrets]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8200/v1/sys/health?standbyok=true 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # Internal only: no published ports. Init/unseal tokens stay outside Git.
  secrets-init:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/init-openbao.sh"]
    environment:
      BAO_ADDR: http://secrets:8200
      OPERATOR_DIR: /operator
      TOKEN_DIR: /token
    volumes:
      - openbao-operator:/operator
      - openbao-init:/token
      - ./scripts/init-openbao.sh:/scripts/init-openbao.sh:ro
      - ./scripts/provision-app-bootstrap.sh:/scripts/provision-app-bootstrap.sh:ro
      - ./infra/openbao/junctura-core.hcl:/policy/junctura-core.hcl:ro
    depends_on:
      secrets:
        condition: service_healthy
    networks: [secrets]
    restart: "no"
    # Root only for this one-shot initializer so volume bootstrap works on
    # Docker Desktop; Core remains non-root and mounts only core-token.
  workflow:
    image: flowable/flowable-rest:8.0.0@sha256:708dfa32f27b93180bb6e7a30684d881d995fe257f5b8413e14b20a55c25672d
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/junctura_workflow
      SPRING_DATASOURCE_USERNAME: junctura_workflow
      SPRING_DATASOURCE_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Run npm run setup first}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      FLOWABLE_REST_APP_ADMIN_USERID: junctura-engine
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${WORKFLOW_ADMIN_PASSWORD:?Run npm run setup first}
      FLOWABLE_REST_APP_CREATEDEMODEFINITIONS: "false"
      FLOWABLE_REST_APP_SWAGGERDOCSENABLED: "false"
      FLOWABLE_HISTORYLEVEL: full
      JAVA_OPTS: -Xms128m -Xmx512m
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          auth=$$(printf 'junctura-engine:%s' "$$FLOWABLE_REST_APP_ADMIN_PASSWORD" | base64 | tr -d '\n');
          wget -q -O /dev/null --header="Authorization: Basic $$auth"
          http://127.0.0.1:8080/flowable-rest/service/management/engine
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks: [workflow]
  workflow-init:
    image: junctura-core:local
    pull_policy: never
    command: [node, scripts/init-workflows.mjs]
    environment:
      WORKFLOW_URL: http://workflow:8080/flowable-rest/service
      WORKFLOW_ADMIN_PASSWORD: ${WORKFLOW_ADMIN_PASSWORD:?Run npm run setup first}
      WORKFLOW_TENANTS: ${WORKFLOW_TENANTS:-demo,production,tenant-a,tenant-b}
    volumes:
      - ./infra/flowable/checkpoint.bpmn20.xml:/definitions/checkpoint.bpmn20.xml:ro
      - ${WORKFLOW_DEFINITIONS_DIR:-./infra/workflows}:/definitions/business:ro
    depends_on:
      workflow:
        condition: service_healthy
    networks: [workflow]
  core:
    build: .
    image: junctura-core:local
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OIDC_ISSUER: ${PUBLIC_URL:-http://127.0.0.1:8080}/identity/realms/junctura
      IDENTITY_URL: http://identity:8080/identity/realms/junctura
      CORE_CLIENT_SECRET: ${CORE_CLIENT_SECRET:?Run npm run setup first}
      STRICT_RECORD_WRITES: ${STRICT_RECORD_WRITES:-false}
      DATA_URL: http://data:3000
      DATA_JWT_SECRET: ${DATA_JWT_SECRET:?Run npm run setup first}
      LEGACY_RESOURCE_CLIENTS: ${LEGACY_RESOURCE_CLIENTS-tenant-a,tenant-b,reader}
      OBJECTS_URL: http://objects:8888
      OBJECTS_MASTER_URL: http://objects:9333
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Run npm run setup first, or on an upgrade append a generated MEILI_MASTER_KEY to the existing .env}
      SECRETS_URL: http://secrets:8200
      SECRETS_TOKEN_FILE: /run/junctura/core-token
      SECRETS_MOUNT: ${SECRETS_MOUNT:-secret}
      WORKFLOW_URL: http://workflow:8080/flowable-rest/service
      WORKFLOW_ADMIN_PASSWORD: ${WORKFLOW_ADMIN_PASSWORD:?Run npm run setup first}
      DIRECTORY_SYNC_CLIENT_ID: ${DIRECTORY_SYNC_CLIENT_ID:-junctura-directory-sync}
      DIRECTORY_SYNC_CLIENT_SECRET: ${DIRECTORY_SYNC_CLIENT_SECRET:-}
      APP_SYNC_CLIENT_ID: ${APP_SYNC_CLIENT_ID:-junctura-app-sync}
      APP_SYNC_CLIENT_SECRET: ${APP_SYNC_CLIENT_SECRET:-}
      C4A_ENABLED: ${C4A_ENABLED:-false}
      C4A_PROVIDER_ORIGINS: ${C4A_PROVIDER_ORIGINS:-[]}
      C4B_ENABLED: ${C4B_ENABLED:-false}
      C4B_PROVIDER_ORIGINS: ${C4B_PROVIDER_ORIGINS:-[]}
    depends_on:
      identity:
        condition: service_healthy
      data:
        condition: service_started
      objects:
        condition: service_started
      clamav:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      workflow-init:
        condition: service_completed_successfully
    read_only: true
    volumes:
      - openbao-init:/run/junctura:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 10s
    networks: [identity, data, objects, scanner, secrets, workflow, edge, searchnet, monitoring]
  gateway:
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, identity]
  console:
    profiles: ["console"]
    image: junctura-console:local
    build:
      context: .
      dockerfile: console/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 5s
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [edge]
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Scraping stays on the internal monitoring network; monitoring-ui (not
    # internal) is what lets Docker publish the loopback port to the host.
    networks: [monitoring, monitoring-ui]
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.4.15@sha256:2894082f6cf7081aefdc1389265c04000812309208c190d75e8c65f7a30e4b7e
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [monitoring, monitoring-ui]

networks:
  edge:
  identity:
    internal: true
  data:
    internal: true
  objects:
    internal: true
  scanner:
    internal: true
  secrets:
    internal: true
  workflow:
    internal: true
  searchnet:
    internal: true
  monitoring:

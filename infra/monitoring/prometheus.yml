# Scrape Prometheus itself and Core. Core publishes /metrics only on the
# internal monitoring network; the gateway never proxies it to callers.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: core
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8080"]

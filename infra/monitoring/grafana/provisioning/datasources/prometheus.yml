# Prometheus datasource, provisioned read-only. The URL is the compose service
# name on the internal monitoring network, never a public address.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

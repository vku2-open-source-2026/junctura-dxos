limit_req_zone $binary_remote_addr zone=core_limit:10m rate=100r/s;
# Structured access log: one JSON line per request, correlated by request_id.
# Only the path is logged (no query string, headers or bodies), so tokens never
# reach the log. View with: docker compose logs gateway
map $request_id $junctura_request_id {
    "~^(.{8})(.{4})(.{4})(.{4})(.{12})$" $1-$2-$3-$4-$5;
}
log_format junctura_json escape=json '{"time":"$time_iso8601","request_id":"$junctura_request_id",'
  '"client":"$remote_addr","method":"$request_method","path":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream_s":"$upstream_response_time"}';
# Core names the reason when it refuses a gateway authorization check; only
# machine codes pass through, anything else falls back to a generic code.
map $auth_error $auth_error_code {
    "~^[a-z_]{1,64}$" $auth_error;
    default "access_denied";
}
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream core_backend {
    zone core_backend 64k;
    server core:8080 resolve;
}
upstream identity_backend {
    zone identity_backend 64k;
    server identity:8080 resolve;
}
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    access_log /var/log/nginx/access.log junctura_json;
    client_max_body_size 10m;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header X-Request-Id;
    add_header X-Request-ID $junctura_request_id always;

    location = /health { access_log off; proxy_pass http://core_backend; }
    location = /ready { access_log off; proxy_pass http://core_backend; }
    location /identity/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://identity_backend;
    }
    location = /_authorize {
        internal;
        proxy_pass http://core_backend/internal/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Junctura-Request-Id $junctura_gateway_id;
    }
    location = /v1/events {
        # Capture the main request ID before the auth subrequest runs.
        set $junctura_gateway_id $request_id;
        error_page 500 = @identity_unavailable;
        error_page 401 = @auth_unauthorized;
        error_page 403 = @auth_forbidden;
        limit_req zone=core_limit burst=50 nodelay;
        limit_req_status 429;
        auth_request /_authorize;
        auth_request_set $auth_error $upstream_http_x_junctura_auth_error;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 45s;
        send_timeout 15s;
        proxy_pass http://core_backend;
        proxy_set_header X-Junctura-Request-Id $junctura_gateway_id;
    }
    location = /v1/token-exchange {
        limit_req zone=core_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://core_backend;
        proxy_set_header X-Junctura-Request-Id $request_id;
    }
    location ~ ^/v[12]/ {
        set $junctura_gateway_id $request_id;
        error_page 500 = @identity_unavailable;
        error_page 401 = @auth_unauthorized;
        error_page 403 = @auth_forbidden;
        limit_req zone=core_limit burst=50 nodelay;
        limit_req_status 429;
        auth_request /_authorize;
        auth_request_set $auth_error $upstream_http_x_junctura_auth_error;
        proxy_pass http://core_backend;
        proxy_set_header X-Junctura-Request-Id $junctura_gateway_id;
    }
    location @identity_unavailable { default_type application/json; return 503 '{"error":"identity_unavailable"}'; }
    location @auth_unauthorized { default_type application/json; return 401 '{"error":"$auth_error_code"}'; }
    location @auth_forbidden { default_type application/json; return 403 '{"error":"$auth_error_code","requestId":"$junctura_request_id"}'; }
    location / { default_type application/json; return 404 '{"error":"not_found"}'; }
}
